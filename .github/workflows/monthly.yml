name: monthly-data
on:
  schedule:
    - cron: "0 12 20 * *"   # 20th of each month, 12:00 UTC (8 AM ET in EDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: cartel-data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: "Fetch SESNSP, CBP, CDC VSRR (free, no keys; failures keep last good file)"
        run: python pipeline/fetch_monthly.py
      - name: Validate (fail = nothing committed)
        run: python pipeline/validate.py
      - name: Commit
        run: |
          git config user.name "cartel-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Monthly data $(date -u +%F)"
          git pull --rebase -X theirs origin main && git push
