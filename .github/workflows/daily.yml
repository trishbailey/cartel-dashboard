name: daily-shortlist
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6 AM ET (EDT) / 5 AM ET (EST)
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: cartel-data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: "Collect RSS + Brave free tier (no model calls, .cn blocked)"
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python pipeline/collect.py
      - name: Merge headlines, refresh baseline
        run: python pipeline/apply.py && python pipeline/validate.py
      - name: Commit
        run: |
          git config user.name "cartel-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Shortlist $(date -u +%F)"
          git pull --rebase -X theirs origin main && git push
