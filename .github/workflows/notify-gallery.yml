name: notify-gallery
# Tells osint-gallery (beacon-tools) to re-sync /cartel/ right after this repo's main changes.
# The gallery's 15-minute cron stays as a fallback.
# Needs secret GALLERY_DISPATCH_TOKEN: fine-grained token, repo osint-gallery only, Actions + Contents read/write.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [daily-shortlist, monthly-data, apply-reasoner]
    types: [completed]
  workflow_dispatch:
permissions: {}
concurrency: {group: notify-gallery, cancel-in-progress: true}
jobs:
  dispatch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch osint-gallery sync-dashboards for cartel
        env:
          GH_TOKEN: ${{ secrets.GALLERY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GALLERY_DISPATCH_TOKEN secret is not set"; exit 1; fi
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/trishbailey/osint-gallery/dispatches \
            -d '{"event_type":"dashboard-updated","client_payload":{"slug":"cartel"}}'
          echo "Dispatched sync for cartel"
